# Local overrides (not the launch default). Prefer params_laptop.yaml / params_robot.yaml:
#   ros2 launch g1_perception perception.launch.py config:=params_laptop.yaml
# Relative model_path is resolved against the process cwd (use /ws or humble_ws).
perception_node:
  ros__parameters:
    # Inputs (RealSense aligned depth: 16UC1 millimetres)
    color_topic: /camera/camera/color/image_raw
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    sync_queue_size: 10
    sync_slop_s: 0.05

    # Outputs
    output_topic: /perception/cubes
    debug_image_topic: /perception/debug_image
    mask_topic: /perception/mask
    target_frame: camera_link
    tf_timeout_s: 0.1

    # Pipeline
    segmenter: yolo_seg
    pose_estimator: geometric
    # Prefer .pt on laptop with CUDA; .onnx (imgsz 640) also works via Ultralytics.
    model_path: runs/segment/runs/seg/cubes-2/weights/best.pt
    device: ""
    conf: 0.25
    verify_hsv: false
    rois_path: ""
    hsv_path: ""
    labels_path: ""

    # Pose estimation
    cube_size_m: 0.05
    margin_px: 20
    z_min_m: 0.1
    z_max_m: 2.0
    min_height_m: 0.00                # tape is flat: points must stand above the table
    min_above_ratio: 0.5
    footprint_min_m: 0.0
    footprint_max_m: 0.0
    # Pose update gates (rois_mode none): a cut-off / hidden cube, or every cube
    # while the camera turns fast, keeps its track and colour votes but not
    # the pose of that frame. 0 disables each.
    pose_border_px: 3                 # mask within this of the image edge = cut off
    min_visible_ratio: 0.45           # mask area / cube face at its depth; whole cubes 0.47..1.7 (p1 0.61)
    max_camera_rot_deg_s: 20.0        # camera rotation in target_frame between frames

    # Multi-frame voting
    vote_window: 10
    vote_min_ratio: 0.7
    vote_min_frames: 0

    publish_rate_hz: 5.0
