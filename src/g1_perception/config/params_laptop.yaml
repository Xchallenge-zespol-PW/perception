# Laptop / devcontainer: RealSense (D455 or D435i), YOLO .pt or .onnx on CPU
# (no CUDA on the laptop's AMD GPU; the devcontainer has no GPU either).
# Same keys as params_robot.yaml. Launch:
#   ros2 launch g1_perception perception.launch.py config:=params_laptop.yaml
# Relative model_path is resolved against the process cwd (use /ws or humble_ws).
perception_node:
  ros__parameters:
    # Inputs (RealSense aligned depth: 16UC1 millimetres)
    color_topic: /camera/camera/color/image_raw
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    sync_queue_size: 10
    sync_slop_s: 0.05

    # Outputs
    output_topic: /perception/cubes
    debug_image_topic: /perception/debug_image
    mask_topic: /perception/mask
    target_frame: camera_link
    tf_timeout_s: 0.1

    # Pipeline
    segmenter: yolo_seg
    pose_estimator: geometric
    # .pt or .onnx (imgsz 640); device: "0" only on a machine with CUDA.
    model_path: runs/segment/runs/seg/cubes-2/weights/best.pt
    device: cpu
    fallback_model_path: ""
    fallback_device: cpu
    warmup_runs: 1
    conf: 0.35                    # 0.25 let low-score duplicates through (5th track)
    verify_hsv: false
    rois_mode: none
    rois_path: ""
    hsv_path: ""
    labels_path: ""

    # Pose estimation
    cube_size_m: 0.05
    margin_px: 20
    z_min_m: 0.1
    z_max_m: 2.0
    min_height_m: 0.00             # tape is flat: points must stand above the table
    min_above_ratio: 0.5
    footprint_min_m: 0.0
    footprint_max_m: 0.0
    # Pose update gates (rois_mode none): a cut-off / hidden cube, or every cube
    # while the camera turns fast, keeps its track and colour votes but not
    # the pose of that frame. 0 disables each.
    pose_border_px: 3                 # mask within this of the image edge = cut off
    min_visible_ratio: 0.45           # mask area / cube face at its depth; whole cubes 0.47..1.7 (p1 0.61)
    max_camera_rot_deg_s: 20.0        # camera rotation in target_frame between frames
    # pose_estimator: pnp (YOLO-pose corners; see docs/pose_pnp.md)
    kpt_min_conf: 0.5             # min confidence of every corner
    pnp_max_reproj_px: 2.0        # max PnP reprojection error
    pnp_max_depth_diff_m: 0.03    # max PnP vs depth distance at pnp_depth_diff_ref_m,
    pnp_depth_diff_ref_m: 0.6     # scaled by (z / ref)^2 farther away
    pnp_max_normal_deg: 20.0      # max top-face tilt vs table normal
    pnp_fallback: geometric       # geometric | none

    # Multi-frame voting / tracking over a time window, so laptop CPU and the
    # robot GPU give the same decisions. vote_window caps votes per cube;
    # vote_window_s: 0 / max_missed_s: 0 = old frame window.
    vote_window_s: 2.0
    vote_min_votes: 5
    vote_window: 100
    vote_min_ratio: 0.7
    vote_min_frames: 0
    match_dist_m: 0.03
    max_missed_s: 1.0
    # Slots and the start layout count only tracks seen within fresh_s:
    # a split track (new id after a jump) stays alive max_missed_s.
    fresh_s: 0.3
    max_missed: 5
    # Place assignment: "ok" only if count/line/spacing pass; else all
    # keep their voted colour but get "bad" and id t<track>. Two clusters
    # across the table need a large max_spacing_m.
    slot_axis: "y"
    expected_count: 4
    max_line_deviation_m: 0.08
    min_spacing_m: 0.03
    max_spacing_m: 0.55

    # Exercise 1 outputs (see params_robot.yaml): with a bag the start frames
    # stay in target_frame.
    cube_colors_topic: /cube_colors
    cube_name_prefix: cube_
    start_frame: ""
    latch_s: 1.0
    # A lost cube is found again by a track that voted its colour, lived
    # reid_min_frames frames and stands within reid_max_dz_m of its last height:
    # within reid_near_m of its last pose (x, y), or, pushed out of view, within
    # reid_gate_m of it along the line of the start cubes but not at the last
    # pose of another cube.
    # A track missed for up to reid_hold_s keeps its name (no flipping at rest).
    reid_gate_m: 0.025
    reid_near_m: 0.03
    reid_max_dz_m: 0.04               # the hand over the table is no cube
    reid_hold_s: 0.5
    reid_min_frames: 3
    reid_require_color: true

    publish_rate_hz: 5.0
