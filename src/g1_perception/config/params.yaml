# Default / legacy params (same keys as params_laptop.yaml and params_robot.yaml).
# Launch selects a file via: ros2 launch ... config:=params_laptop.yaml
#   params_laptop.yaml — .pt or .onnx on the laptop / devcontainer
#   params_robot.yaml  — .onnx (imgsz 640), device=cpu on G1/PC2
# See docs/robot.md. Empty strings = package defaults; paths relative to cwd.
perception_node:
  ros__parameters:
    # Inputs (RealSense, aligned depth in 16UC1 mm)
    color_topic: /camera/camera/color/image_raw
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    sync_queue_size: 10
    sync_slop_s: 0.05

    # Outputs
    output_topic: /perception/cubes
    debug_image_topic: /perception/debug_image
    mask_topic: /perception/mask
    # Frame for published poses; "" = camera optical frame. On G1 set the robot frame.
    target_frame: camera_link
    tf_timeout_s: 0.1

    # Pipeline stages (names registered in segmenters/ and pose/)
    segmenter: yolo_seg            # yolo_seg | hsv
    pose_estimator: geometric      # geometric | centroid
    model_path: runs/segment/runs/seg/cubes-2/weights/best.pt
    device: ""                     # "" auto, "cpu", "0"
    conf: 0.25
    verify_hsv: false
    rois_mode: image_roi           # none | image_roi
    rois_path: ""
    hsv_path: ""
    labels_path: ""

    # Pose estimation
    cube_size_m: 0.05
    margin_px: 20
    z_min_m: 0.1                   # <= 0 disables
    z_max_m: 2.0                   # <= 0 disables
    # Shape check: tape and other flat things are not cubes. Mask points
    # min_height_m..1.5*cube_size_m above the table, at least min_above_ratio
    # of them, footprint on the table footprint_min_m..footprint_max_m.
    min_height_m: 0.00             # <= 0 disables the height check
    min_above_ratio: 0.5
    footprint_min_m: 0.0          # 0 disables
    footprint_max_m: 0.0          # 0 disables; real cubes ~5.4 x 7.1 cm (depth edges), p99 11 cm
    # Pose update gates (rois_mode none): a cut-off / hidden cube, or every cube
    # while the camera turns fast, keeps its track and colour votes but not
    # the pose of that frame. 0 disables each.
    pose_border_px: 3                 # mask within this of the image edge = cut off
    min_visible_ratio: 0.45           # mask area / cube face at its depth; whole cubes 0.47..1.7 (p1 0.61)
    max_camera_rot_deg_s: 20.0        # camera rotation in target_frame between frames

    # Multi-frame voting / 3D tracking (rois_mode=none)
    vote_window: 10
    vote_min_ratio: 0.7
    vote_min_frames: 0             # 0 = vote_window
    match_dist_m: 0.03
    max_missed: 5
    slot_axis: "y"
    expected_count: 4
    max_line_deviation_m: 0.03
    min_spacing_m: 0.04
    max_spacing_m: 0.20

    # Exercise 1 outputs (rois_mode=none): xchallenge_msgs/CubeColors, static
    # TF <cube>_start in start_frame ("" = target_frame), TF <cube>.
    cube_colors_topic: /cube_colors
    cube_name_prefix: cube_
    start_frame: ""
    latch_s: 1.0                   # stable time (frame stamps) before freezing the layout
    # A lost cube is found again by a track that voted its colour, lived
    # reid_min_frames frames and stands within reid_max_dz_m of its last height:
    # within reid_near_m of its last pose (x, y), or, pushed out of view, within
    # reid_gate_m of it along slot_axis but not at the last pose of another cube.
    # A track missed for up to reid_hold_s keeps its name (no flipping at rest).
    reid_gate_m: 0.025
    reid_near_m: 0.03
    reid_max_dz_m: 0.04               # the hand over the table is no cube
    reid_hold_s: 0.5
    reid_min_frames: 3
    reid_require_color: true

    # Processing / publishing rate
    publish_rate_hz: 5.0
