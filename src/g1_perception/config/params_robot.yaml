# Unitree G1 / PC2 (Jetson Orin NX): RealSense D435i in head, TensorRT on GPU.
# Same keys as params_laptop.yaml. Launch inside the humble container:
#   ros2 launch g1_perception perception.launch.py config:=params_robot.yaml
# deploy_robot.sh copies .pt / .onnx to ~/humble_ws/models/ (= /ws/models/ in
# the container); the .engine is built on the Jetson (docs/robot.md).
# Force CPU: model_path:=/ws/models/cubes_seg.onnx device:=cpu
perception_node:
  ros__parameters:
    # Inputs (D435i, rgb8 + aligned depth 16UC1 mm)
    color_topic: /camera/camera/color/image_raw
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    sync_queue_size: 10
    sync_slop_s: 0.05

    # Outputs
    output_topic: /perception/cubes
    debug_image_topic: /perception/debug_image
    mask_topic: /perception/mask
    # Frame of the cube poses and of the TF <cube>: the logic node of
    # exercise 1 reads everything relative to pelvis. Needs the camera
    # connected to the robot TF tree (camera calibration).
    target_frame: pelvis
    tf_timeout_s: 0.1

    # Pipeline: TensorRT engine on the GPU; if it cannot load (no CUDA, bad
    # engine), the node falls back to ONNX on CPU and logs a warning.
    segmenter: yolo_seg
    pose_estimator: geometric
    model_path: /ws/models/cubes_seg_v2.engine
    device: "0"
    fallback_model_path: /ws/models/cubes_seg_v2.onnx
    fallback_device: cpu
    warmup_runs: 2
    conf: 0.35                    # 0.25 let low-score duplicates through (5th track)
    verify_hsv: false
    # Free detections + 3D tracker + place assignment (no image ROIs).
    rois_mode: none
    rois_path: ""
    hsv_path: ""
    labels_path: ""

    # Pose estimation
    cube_size_m: 0.05
    margin_px: 20
    z_min_m: 0.1
    z_max_m: 2.0
    min_height_m: 0.01                # tape is flat: points must stand above the table
    min_above_ratio: 0.5
    footprint_min_m: 0.02
    footprint_max_m: 0.13             # real cubes ~5.4 x 7.1 cm (depth edges), p99 11 cm
    # pose_estimator: pnp (YOLO-pose corners; see docs/pose_pnp.md)
    kpt_min_conf: 0.5             # min confidence of every corner
    pnp_max_reproj_px: 2.0        # max PnP reprojection error
    pnp_max_depth_diff_m: 0.03    # max PnP vs depth distance at pnp_depth_diff_ref_m,
    pnp_depth_diff_ref_m: 0.6     # scaled by (z / ref)^2 farther away
    pnp_max_normal_deg: 20.0      # max top-face tilt vs table normal
    pnp_fallback: geometric       # geometric | none

    # Multi-frame voting / tracking over a time window, so GPU (~15 kl/s) and
    # the CPU fallback (~8 kl/s) give the same decisions. vote_window caps
    # votes per cube; vote_window_s: 0 / max_missed_s: 0 = old frame window.
    vote_window_s: 2.0
    vote_min_votes: 5
    vote_window: 100
    vote_min_ratio: 0.7
    vote_min_frames: 0
    match_dist_m: 0.03
    max_missed_s: 1.0
    # Slots and the start layout count only tracks seen within fresh_s:
    # a split track (new id after a jump) stays alive max_missed_s.
    fresh_s: 0.3
    max_missed: 5
    # Exercise 1 (regulations 4.4): a column of 4 cubes along the robot's
    # view (pelvis x), centres 6 cm apart. Place 1 = nearest cube.
    slot_axis: "x"
    expected_count: 4
    max_line_deviation_m: 0.03
    min_spacing_m: 0.04
    max_spacing_m: 0.10

    # Exercise 1 outputs (cube_sorting_node in unitree_controllers)
    cube_colors_topic: /cube_colors   # xchallenge_msgs/CubeColors, transient local
    cube_name_prefix: cube_           # cube_1..cube_4 = expected_cube_names of task_1.yaml
    # Static <cube>_start frames: the feet stand still on the floor, while the
    # pelvis sways. "" = target_frame.
    start_frame: left_ankle_roll_link
    latch_s: 1.0                      # stable time (frame stamps) before the start layout is frozen
    reid_gate_m: 0.025                # lost cube found again within this along slot_axis

    publish_rate_hz: 5.0
